services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      args:
        VERSION: ${HOMELOOM_VERSION:-compose}
        COMMIT: ${HOMELOOM_COMMIT:-unknown}
        BUILD_TIME: ${HOMELOOM_BUILD_TIME:-unknown}
    network_mode: host
    environment:
      HOMELOOM_HTTP_ADDRESS: 0.0.0.0:8090
      HOMELOOM_DATABASE_URL: postgres://homeloom:${HOMELOOM_POSTGRES_PASSWORD:-homeloom-dev}@127.0.0.1:5432/homeloom?sslmode=disable
      HOMELOOM_MASTER_KEY: /data/homeloom.key
      HOMELOOM_TRUSTED_PROXIES: 127.0.0.1/32,::1/128
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - homeloom-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homeloom
      POSTGRES_USER: homeloom
      POSTGRES_PASSWORD: ${HOMELOOM_POSTGRES_PASSWORD:-homeloom-dev}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeloom -d homeloom"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    network_mode: host
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  homeloom-data:
  postgres-data:
  mosquitto-data:
