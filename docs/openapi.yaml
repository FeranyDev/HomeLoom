openapi: 3.1.0
info:
  title: HomeLoom API
  version: 0.1.0
  description: HomeLoom management API. Runtime device values are ephemeral; configuration is stored in PostgreSQL or SQLite through GORM.
servers:
  - url: http://127.0.0.1:8090
security:
  - sessionCookie: []
paths:
  /api/versions:
    get:
      security: []
      operationId: listApiVersions
      responses:
        "200":
          description: Supported management API path versions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [current, supported, deprecated]
                    properties:
                      current: { type: string, const: v1 }
                      supported: { type: array, items: { type: string } }
                      deprecated: { type: array, items: { type: string } }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: Process is alive, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /ready:
    get:
      security: []
      operationId: ready
      responses:
        "200": { description: Required dependencies are available, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { description: A required dependency is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /api/v1/system/version:
    get:
      security: []
      operationId: getVersion
      responses:
        "200": { description: Build information, content: { application/json: { schema: { $ref: "#/components/schemas/VersionResponse" } } } }
  /api/v1/auth/status:
    get:
      security: []
      operationId: getAuthenticationStatus
      responses:
        "200": { description: Administrator initialization and current session status, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
  /api/v1/auth/setup:
    post:
      security: []
      operationId: setupAdministrator
      description: Creates the one administrator account when the database is uninitialized and starts a session.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthRequest" } } } }
      responses:
        "201": { description: Administrator created and session cookies set, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Administrator already initialized }
  /api/v1/auth/login:
    post:
      security: []
      operationId: loginAdministrator
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthRequest" } } } }
      responses:
        "200": { description: Session cookies set, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
        "401": { description: Invalid username or password }
        "429": { description: Client temporarily locked after repeated failures }
  /api/v1/auth/logout:
    post:
      operationId: logoutAdministrator
      description: Revokes the database session. Requires the X-CSRF-Token header.
      responses:
        "204": { description: Session revoked and cookies cleared }
        "403": { description: Invalid CSRF token }
  /api/v1/device-models:
    get:
      operationId: listDeviceModelContracts
      description: Lists versioned unified-model parameters and publisher/consumer grading policies.
      responses:
        "200":
          description: Device model contracts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DeviceModelContract" } }
  /api/v1/device-models/enum-overrides:
    get:
      operationId: listModelEnumOverrides
      responses: { "200": { description: Database-backed enum option overrides for unified-model properties, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ModelEnumOverride" } } } } } } } }
    put:
      operationId: upsertModelEnumOverride
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelEnumOverride" } } } }
      responses: { "200": { description: Enum override persisted and applied to model contracts }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Override path or ID already exists } }
  /api/v1/device-models/enum-overrides/{overrideId}:
    parameters: [{ name: overrideId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteModelEnumOverride
      responses: { "204": { description: Enum override deleted and built-in or custom definition restored }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/device-models/custom-properties:
    get:
      operationId: listCustomModelProperties
      responses: { "200": { description: Database-backed custom unified-model properties, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/CustomModelProperty" } } } } } } } }
    post:
      operationId: createCustomModelProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomModelProperty" } } } }
      responses: { "201": { description: Custom property persisted and added to the model catalog }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: ID or model path already exists } }
  /api/v1/device-models/custom-properties/{propertyId}:
    parameters: [{ name: propertyId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateCustomModelProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomModelProperty" } } } }
      responses: { "200": { description: Custom property updated }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      operationId: deleteCustomModelProperty
      responses: { "204": { description: Custom property deleted }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Property is used by a mapping route } }
  /api/v1/system/settings:
    get:
      operationId: getRuntimeSettings
      responses:
        "200": { description: Database-backed runtime settings, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RuntimeSettings" } } } } } }
    put:
      operationId: updateRuntimeSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeSettings" } } } }
      responses:
        "200": { description: Settings persisted and applied without restart, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RuntimeSettings" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/system/subprocess-logs:
    get:
      operationId: listSubprocessLogs
      description: Returns the bounded, redacted in-memory stdout/stderr stream collected from Camera Kernel and Matter sidecar processes.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: Return entries with a sequence greater than this cursor. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        "200":
          description: Redacted child-process log entries
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: "#/components/schemas/SubprocessLogEntry" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/config-export:
    get:
      operationId: exportConfiguration
      description: Downloads a no-store configuration snapshot. Provider credentials are recursively redacted and Target PIN, setup URI, and storage path are omitted.
      responses:
        "200":
          description: Redacted configuration attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConfigurationExport" } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/diagnostic-bundle:
    get:
      operationId: downloadDiagnosticBundle
      description: Downloads a no-store support bundle containing build data, metrics, the redacted configuration snapshot, and body-free audit metadata.
      responses:
        "200":
          description: Redacted diagnostic attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/DiagnosticBundle" } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/backup:
    post:
      operationId: downloadDatabaseBackup
      description: Creates a consistent database-neutral logical snapshot plus its master key as a sensitive ZIP archive. Requires X-CSRF-Token and the exact BACKUP confirmation phrase.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses:
        "200": { description: No-store ZIP attachment containing homeloom-database.json and homeloom-master.key, content: { application/zip: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/system/restore:
    post:
      operationId: stageDatabaseRestore
      description: Validates and stages a complete backup for atomic application before the next process startup. The current database is preserved as a pre-restore snapshot and restored browser sessions are invalidated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, confirmation]
              properties:
                file: { type: string, format: binary }
                confirmation: { type: string, const: RESTORE }
      responses:
        "202": { description: Restore validated and staged, content: { application/json: { schema: { $ref: "#/components/schemas/PendingRestoreResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Another restore is already pending }
        "413": { description: Restore archive exceeds 256 MiB }
  /api/v1/system/master-key:
    get:
      operationId: getMasterKeyStatus
      description: Returns only opaque version and ciphertext-count state; neither key material, ciphertext, scope nor plaintext is returned.
      responses:
        "200": { description: Master key rotation status, headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/MasterKeyStatusResponse" } } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/master-key/rotate:
    post:
      operationId: rotateMasterKey
      description: Requires X-CSRF-Token and the exact ROTATE confirmation. Atomically re-encrypts durable secrets using a new active key; set resume=true to retry an interrupted batch with the already active key.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MasterKeyRotationRequest" } } } }
      responses:
        "200": { description: Rotation completed without exposing secret material, headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/MasterKeyRotationResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        "200": { description: Runtime metrics snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
  /api/v1/mapping/preview:
    post:
      operationId: previewMapping
      description: Validates and executes an ephemeral mapping profile without persisting it or writing a device. Reverse direction applies reversible transforms in reverse order.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MappingPreviewRequest" } }
      responses:
        "200":
          description: Final typed value and each evaluated transform step
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/MappingPreviewResult" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/mapping/catalog:
    get:
      operationId: getMappingCatalog
      description: Returns unprojected Provider attributes, the merged three-level unified model catalog, and every built-in Consumer property. Provider devices include catalog provenance and completeness metadata.
      responses:
        "200": { description: Visual mapping catalog, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingCatalog" } } } } } }
  /api/v1/logical-devices:
    get:
      operationId: listLogicalDevices
      responses:
        "200":
          description: Persisted manual multi-Provider device links
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LogicalDevice" } }
    post:
      operationId: createLogicalDevice
      description: Creates a manual device link. Candidate discovery never creates a link automatically.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LogicalDevice" } } } }
      responses: { "201": { description: Link persisted and applied }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Identity conflicts with a concrete device } }
  /api/v1/logical-devices/candidates:
    get:
      operationId: listLogicalDeviceCandidates
      description: Review-only candidates requiring same type, normalized name, and a shared source home or room. Names alone never produce a candidate or merge.
      responses:
        "200":
          description: Manual-link suggestions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LogicalDeviceCandidate" } }
  /api/v1/logical-devices/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { operationId: getLogicalDevice, responses: { "200": { description: Manual device link }, "404": { $ref: "#/components/responses/NotFound" } } }
    put:
      operationId: updateLogicalDevice
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LogicalDevice" } } } }
      responses: { "200": { description: Link persisted and reapplied }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete: { operationId: deleteLogicalDevice, responses: { "204": { description: Unlinked; concrete sources are republished }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/v1/logical-devices/{id}/explanations:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getLogicalDeviceRouteExplanations
      responses:
        "200":
          description: Selected attribute and command candidates with availability and reason
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LogicalRouteExplanation" } }
  /api/v1/mapping/consumers:
    get:
      operationId: listConsumerCatalogs
      description: Returns only the static Consumer capability catalogs without querying Provider source devices.
      responses:
        "200": { description: Consumer adapter properties and supported unified models, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ConsumerCatalog" } } } } } } }
  /api/v1/mapping/bindings:
    get:
      operationId: listMappingBindings
      responses: { "200": { description: Device-scoped Provider and Consumer routes, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MappingBinding" } } } } } } } }
    post:
      operationId: createMappingBinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingBinding" } } } }
      responses: { "201": { description: Route persisted and applied }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Source or model destination is already routed } }
  /api/v1/mapping/bindings/{bindingId}:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    get: { operationId: getMappingBinding, responses: { "200": { description: Mapping route }, "404": { $ref: "#/components/responses/NotFound" } } }
    put:
      operationId: updateMappingBinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingBinding" } } } }
      responses: { "200": { description: Route updated and reapplied }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete: { operationId: deleteMappingBinding, responses: { "204": { description: Route deleted and runtime refreshed }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/v1/mapping/profiles:
    get:
      operationId: listMappingProfiles
      responses: { "200": { description: Built-in and database-backed profiles, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } } } }
    post:
      operationId: createMappingProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingProfile" } } } }
      responses:
        "201": { description: Profile persisted and hot-loaded, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Profile ID already exists or is reserved by a built-in profile, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mapping/profiles/import:
    post:
      operationId: importMappingProfiles
      description: Validates the complete batch before atomically upserting user profiles. Existing versions must increase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profiles]
              properties: { profiles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MappingProfile" } } }
      responses:
        "200": { description: Imported and hot-loaded profiles, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/mapping/profiles/export:
    get:
      operationId: exportMappingProfiles
      description: Downloads only user profiles so the artifact can be imported without colliding with built-ins.
      responses:
        "200": { description: Import-compatible no-store JSON attachment, content: { application/json: { schema: { type: object, required: [schemaVersion, profiles], properties: { schemaVersion: { type: integer, const: 1 }, profiles: { type: array, items: { $ref: "#/components/schemas/MappingProfile" } } } } } } }
  /api/v1/mapping/profiles/{profileId}:
    parameters: [{ name: profileId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMappingProfile
      responses: { "200": { description: Profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: updateMappingProfile
      description: Persists and hot-loads a version newer than the currently stored version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingProfile" } } } }
      responses: { "200": { description: Updated profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Built-in profile is read-only } }
    delete:
      operationId: deleteMappingProfile
      responses: { "204": { description: User profile deleted from PostgreSQL and the live snapshot }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Built-in profile is read-only } }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Persisted audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/events:
    get:
      operationId: streamChanges
      responses:
        "200":
          description: The single server-sent event stream. Named device, device-event, state, command, audit, target and runtime events are emitted only after changes. Runtime data is sampled from memory every 5 seconds and contains only changed categories. No initial full snapshot is sent; clients reconcile full REST resources separately. Heartbeat comments are emitted every 15 seconds.
          content: { text/event-stream: { schema: { type: string } } }
  /api/v1/ai-service/config:
    get:
      operationId: getAIServiceConfig
      description: Returns the local Agent's generic AI-service configuration, including the effective and default Agent system prompts. The API key is never returned.
      responses:
        "200": { description: AI service status, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIServiceStatus" } } } } } }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: saveAIServiceConfig
      description: Proxies the administrator's configuration to the same-host MCP Agent. The key is stored only in the Agent's private file and is excluded from all responses and Core persistence.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIServiceConfigInput" } } } }
      responses:
        "200": { description: Saved AI service status, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIServiceStatus" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/ai-service/models:
    get:
      operationId: listAIServiceModels
      description: Fetches model IDs from the configured service's OpenAI-compatible GET /models endpoint.
      responses:
        "200": { description: Model IDs, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AIModel" } } } } } } }
        "503": { $ref: "#/components/responses/Unavailable" }
        "502": { description: The configured AI service could not be reached or rejected model discovery. }
  /api/v1/ai-service/runs:
    post:
      operationId: startAIServiceRun
      description: Sends an administrator message to the same-host Agent. One model request may take up to two minutes and the complete tool loop up to six minutes. A device write is returned as an awaiting-approval plan and is never executed by this call.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string, minLength: 1, maxLength: 16384 } } } } } }
      responses:
        "200": { description: AI run result, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIRun" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "408": { description: The model reasoning or complete Agent run exceeded its bounded timeout. No device write was executed. }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/ai-service/runs/{runId}:
    parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getAIServiceRun
      responses: { "200": { description: AI run result, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIRun" } } } } } }, "404": { $ref: "#/components/responses/NotFound" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/ai-service/runs/{runId}/approve:
    parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: approveAIServiceRun
      description: Explicitly approves one non-expired AI device-operation plan. Core rechecks authorization and state version before writing.
      responses: { "200": { description: AI run after approval, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIRun" } } } } } }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Plan expired or cannot be approved }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/ai-service/automations:
    get:
      operationId: listAIAutomations
      responses: { "200": { description: Persisted AI automation definitions, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AIAutomation" } } } } } } }, "503": { $ref: "#/components/responses/Unavailable" } }
    post:
      operationId: createAIAutomation
      description: Creates a scheduled or typed state-triggered task. A trigger property must be authorized for AI.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIAutomationInput" } } } }
      responses: { "201": { description: Automation created, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIAutomation" } } } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/ai-service/automations/{automationId}:
    parameters: [{ name: automationId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateAIAutomation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIAutomationInput" } } } }
      responses: { "200": { description: Automation updated, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AIAutomation" } } } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" }, "503": { $ref: "#/components/responses/Unavailable" } }
    delete:
      operationId: deleteAIAutomation
      responses: { "204": { description: Automation deleted }, "404": { $ref: "#/components/responses/NotFound" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/ai-service/automations/{automationId}/run:
    parameters: [{ name: automationId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: runAIAutomationNow
      description: Manually invokes a task once in a new AI session. Unattended tasks automatically approve an AI-prepared device plan after Core rechecks authorization and current state.
      responses: { "200": { description: Task and its Agent run summary, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [automation, run], properties: { automation: { $ref: "#/components/schemas/AIAutomation" }, run: { $ref: "#/components/schemas/AIAutomationRun" } } } } } } } }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Automation disabled or already running }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/ai-service/automations/{automationId}/runs/{runId}/approve:
    parameters: [{ name: automationId, in: path, required: true, schema: { type: string } }, { name: runId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: approveAIAutomationRun
      description: Explicitly approves one unexpired plan from a task configured for manual execution, then updates its persisted run history.
      responses: { "200": { description: Task and its approved Agent run, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [automation, run], properties: { automation: { $ref: "#/components/schemas/AIAutomation" }, run: { $ref: "#/components/schemas/AIAutomationRun" } } } } } } } }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Plan expired or cannot be approved }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/devices:
    get:
      operationId: listDevices
      responses:
        "200": { description: Device snapshots, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } } } } } }
  /api/v1/locations:
    get:
      operationId: listDeviceLocationHomes
      description: Lists the HomeLoom-owned canonical home and room directory used by unified-device location selection. Provider source locations with normalized matching names use these canonical IDs while their source IDs remain available on the Device.
      responses:
        "200": { description: Configured homes with nested rooms, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/DeviceLocationHome" } } } } } } }
  /api/v1/locations/homes:
    post:
      operationId: createDeviceLocationHome
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } } }
      responses: { "201": { description: Home created }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Home name already exists } }
  /api/v1/locations/homes/{homeId}:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateDeviceLocationHome
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } } }
      responses: { "200": { description: Home renamed and assigned device names refreshed }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Home name already exists } }
    delete:
      operationId: deleteDeviceLocationHome
      responses: { "204": { description: Unused home and its rooms deleted }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Home is assigned to a unified device } }
  /api/v1/locations/homes/{homeId}/rooms:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: createDeviceLocationRoom
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } } }
      responses: { "201": { description: Room created }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Room name already exists in this home } }
  /api/v1/locations/homes/{homeId}/rooms/{roomId}:
    parameters: [{ name: homeId, in: path, required: true, schema: { type: string } }, { name: roomId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateDeviceLocationRoom
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } } }
      responses: { "200": { description: Room renamed and assigned device names refreshed }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Room name already exists in this home } }
    delete:
      operationId: deleteDeviceLocationRoom
      responses: { "204": { description: Unused room deleted }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Room is assigned to a unified device } }
  /api/v1/devices/{deviceId}/states:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    get:
      operationId: listDeviceStates
      responses:
        "200": { description: In-memory state with provenance and explicit unknown/unavailable semantics, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/StateValue" } } } } } } }
  /api/v1/devices/{deviceId}/mcp-config:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    get:
      operationId: getDeviceMCPConfig
      description: Gets the device-level MCP exposure flag, default access, and AI usage note. A device with no stored configuration is returned as disabled and hidden by default.
      responses:
        "200": { description: Device MCP configuration, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MCPDeviceConfig" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: saveDeviceMCPConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MCPDeviceConfigInput" } } } }
      responses:
        "200": { description: Persisted device MCP configuration, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MCPDeviceConfig" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/mcp-properties:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    get:
      operationId: listDeviceMCPPropertyConfigs
      description: Lists only explicit property-level overrides; absent properties inherit the device default.
      responses:
        "200": { description: Property MCP configurations, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MCPPropertyConfig" } } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/mcp-properties/{endpointId}/{capabilityId}/{propertyId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
      - { $ref: "#/components/parameters/EndpointId" }
      - { $ref: "#/components/parameters/CapabilityId" }
      - { $ref: "#/components/parameters/PropertyId" }
    put:
      operationId: saveDeviceMCPPropertyConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MCPPropertyConfigInput" } } } }
      responses:
        "200": { description: Persisted property MCP override, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MCPPropertyConfig" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDeviceMCPPropertyConfig
      description: Clears the property override so it inherits the device default and no longer has a property-specific note.
      responses:
        "204": { description: Property MCP override cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/enabled:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    put:
      operationId: setDeviceEnabled
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: Persisted device preference applied immediately, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Device" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/location:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    put:
      operationId: setDeviceLocation
      description: Selects the HomeLoom unified-device location. Source mode follows future Provider location changes; custom mode references a configured HomeLoom home and optional room by stable ID without mutating Provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [mode]
                  properties: { mode: { type: string, const: source } }
                - type: object
                  required: [mode, homeId]
                  properties:
                    mode: { type: string, const: custom }
                    homeId: { type: string }
                    roomId: { type: string }
      responses:
        "200": { description: Persisted location preference applied immediately, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Device" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/simulation:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    patch:
      operationId: simulateVirtualDevice
      description: Changes ephemeral Virtual Provider state; values are never persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability: { type: string, enum: [online, offline, unknown] }
                online: { type: boolean }
                power: { type: boolean }
                temperature: { type: number, minimum: -100, maximum: 200 }
                humidity: { type: number, minimum: 0, maximum: 100 }
                contact: { type: boolean }
                motion: { type: boolean }
                active: { type: boolean }
                speed: { type: number, minimum: 0, maximum: 100 }
                mode: { type: string, enum: [manual, auto] }
                filterLife: { type: number, minimum: 0, maximum: 100 }
                filterChange: { type: boolean }
                position: { type: integer, minimum: 0, maximum: 100 }
                sequence: { type: integer, minimum: 0 }
                repeat: { type: integer, minimum: 1, maximum: 10 }
              minProperties: 1
      responses:
        "200": { description: Updated ephemeral device snapshot, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Device" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/devices/{deviceId}/endpoints/{endpointId}/capabilities/{capabilityId}/properties/{propertyId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
      - { $ref: "#/components/parameters/EndpointId" }
      - { $ref: "#/components/parameters/CapabilityId" }
      - { $ref: "#/components/parameters/PropertyId" }
    get:
      operationId: readProperty
      responses:
        "200": { description: Provider property value, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Property" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: writeProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PropertyValue" } } } }
      responses:
        "200": { description: Updated device and command lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCommandResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/devices/{deviceId}/endpoints/{endpointId}/capabilities/{capabilityId}/commands/{commandId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
      - { $ref: "#/components/parameters/EndpointId" }
      - { $ref: "#/components/parameters/CapabilityId" }
      - { name: commandId, in: path, required: true, schema: { type: string } }
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
    post:
      operationId: executeCommand
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters: { type: object, additionalProperties: { $ref: "#/components/schemas/PropertyValue" } }
      responses:
        "200": { description: Updated device and action lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCommandResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Idempotency key conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/providers:
    get:
      operationId: listProviders
      responses: { "200": { description: Provider configurations and runtime status, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
    post:
      operationId: createProvider
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses: { "200": { description: Provider created, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/providers/test:
    post:
      operationId: testProviderConnection
      description: Validates configuration and connects a short-lived provider without persisting or replacing runtime state.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses:
        "200": { description: Connection and subscription succeeded, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [reachable], properties: { reachable: { type: boolean, const: true } } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/providers/scan:
    post:
      operationId: scanProviderNetwork
      description: Invokes an optional transient Provider network scanner with the unsaved configuration. The request is neither persisted nor applied to the runtime catalog; this is distinct from DiscoverDevices.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses:
        "200": { description: Transient network discovery candidates, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderDiscoveryCandidate" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/providers/{providerId}/auth-challenge:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProviderAuthChallenge
      description: Returns the short-lived Xiaomi SMS/email challenge retained during Provider startup. Passwords and verification codes are never returned.
      responses:
        "200": { description: Pending identity challenge, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderAuthChallenge" } } } } } }
        "409": { description: Challenge missing or expired, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: verifyProviderAuthChallengeLegacy
      description: Compatibility action for completing a retained Provider identity challenge.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAuthChallengeVerification" } } } }
      responses:
        "200": { description: Provider with refreshed runtime session, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Challenge missing, expired, or exhausted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/providers/{providerId}/auth-challenge/verify:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: verifyProviderAuthChallenge
      description: Completes the retained Xiaomi identity challenge and reapplies the Provider with the returned session credentials.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAuthChallengeVerification" } } } }
      responses:
        "200": { description: Provider with refreshed runtime session, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Challenge missing, expired, or exhausted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/xiaomi/oauth/start:
    post:
      operationId: startXiaomiOAuth
      description: Generates or reuses the stable OAuth identity and returns the Xiaomi authorization URL using the fixed http://homeassistant.local:8123 redirect URI. Requires an authenticated administrator session.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/XiaomiOAuthStart" } } } }
      responses:
        "200": { description: Authorization URL, state, OAuth UUID and virtual DID, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/oauth/complete:
    post:
      operationId: completeXiaomiOAuth
      description: Accepts code and state parsed by the UI from the complete callback URL copied by the user, validates state, exchanges the authorization code, retrieves the account UID and issues an Ed25519 central-hub client certificate. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/XiaomiOAuthStart" }, { type: object, required: [code, state], properties: { code: { type: string }, state: { type: string } } }] } } } }
      responses:
        "200": { description: OAuth token metadata and in-memory PEM material to include in the encrypted Provider configuration, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi-miot-cloud/login/start:
    post:
      operationId: startXiaomiMIoTCloudLogin
      description: Starts third-party-compatible Xiaomi account login. Returns a complete session or a short-lived in-memory challenge that preserves the original Xiaomi cookie jar for SMS/email verification. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/XiaomiCloudLoginStart" } } } }
      responses:
        "200": { description: Complete cloud session or identity-verification challenge, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/XiaomiCloudLoginResult" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi-miot-cloud/login/verify:
    post:
      operationId: verifyXiaomiMIoTCloudLogin
      description: Submits the SMS/email code into the retained Xiaomi login session. The challenge is single-use after success, expires after ten minutes and allows at most five attempts. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId, code], properties: { challengeId: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: Complete Xiaomi cloud session, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/XiaomiCloudLoginResult" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/gateways:
    get:
      operationId: discoverXiaomiCentralGateways
      description: Browses `_miot-central._tcp.local.` for five seconds and returns role/MQTT capability metadata from the mDNS profile.
      responses:
        "200": { description: Discovered central hubs, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/providers/{providerId}/devices:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: discoverXiaomiHubDevices
      description: Reuses the established MQTT connection of an enabled, running Xiaomi Provider and returns its central-hub subdevice directory. OAuth/certificate provisioning and Provider connection must already be complete.
      responses:
        "200": { description: Central gateway device directory, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/XiaomiHubDevice" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Xiaomi Provider is not enabled and connected }
  /api/v1/xiaomi-miot-cloud/providers/{providerId}/devices:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: discoverXiaomiMIoTCloudDevices
      description: Reuses the active xiaomi-miot-cloud account session and returns its Xiaomi account device directory. This is the third-party-compatible hass-xiaomi-miot style API, not the reserved future official Xiaomi Home Cloud Provider.
      responses:
        "200": { description: Xiaomi MIoT cloud account device directory, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/XiaomiHubDevice" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Xiaomi MIoT cloud Provider is not enabled and connected }
  /api/v1/providers/{providerId}:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateProvider
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses: { "200": { description: Provider updated, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
    delete:
      operationId: deleteProvider
      responses: { "204": { description: Provider deleted }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/providers/{providerId}/restart:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: restartProvider
      responses: { "200": { description: Provider restarted, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets:
    get:
      operationId: listTargets
      description: HomeKit targets include a paired boolean. Once paired, one-time PIN, Setup ID and Setup URI values are omitted and the pairing QR endpoint is unavailable.
      responses: { "200": { description: Target configurations and status, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
    post:
      operationId: createTarget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TargetInput" } } } }
      responses: { "200": { description: Target created, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets/{targetId}:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateTarget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TargetInput" } } } }
      responses: { "200": { description: Target updated, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
    delete:
      operationId: deleteTarget
      responses: { "204": { description: Target deleted }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets/{targetId}/pairing/regenerate:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: regenerateTargetPairing
      description: Generates a new HomeKit PIN and Setup ID only while the target is unpaired. Paired targets must clear their pairing identity instead. Confirmation must equal REGENERATE followed by the target ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Updated Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/pairing-identity:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: clearTargetPairingIdentity
      description: Stops the bridge, safely removes HAP keys and controller pairings, then rebuilds it. Confirmation must equal CLEAR followed by the target ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Target rebuilt with a fresh pairing identity }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/commissioning-qr:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMatterCommissioningQR
      description: Returns a no-store PNG only while the Matter commissioning window is open and the runtime exposes a setup payload.
      responses: { "200": { description: Matter commissioning QR PNG, content: { image/png: { schema: { type: string, format: binary } } } }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/commissioning-window:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: openMatterCommissioningWindow
      description: Opens the temporary Matter commissioning window. Confirmation must equal OPEN COMMISSIONING followed by the target ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                durationSeconds: { type: integer, minimum: 180, maximum: 900 }
                confirmation: { type: string, description: Must equal OPEN COMMISSIONING followed by the target ID. }
      responses: { "200": { description: Updated Matter Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      operationId: closeMatterCommissioningWindow
      responses: { "200": { description: Updated Matter Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/endpoints/{consumerDeviceId}/device-type:
    parameters:
      - { name: targetId, in: path, required: true, schema: { type: string } }
      - { name: consumerDeviceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmMatterEndpointDeviceType
      description: Atomically confirms the stable Endpoint identity's new Device Type, persists the Target device configuration and reapplies the Matter runtime. Confirmation must equal CHANGE ENDPOINT TYPE followed by target ID, consumer device ID and the new device type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterEndpointDeviceTypeRequest" }
      responses: { "200": { description: Updated Matter Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/fabrics/{fabricId}:
    parameters:
      - { name: targetId, in: path, required: true, schema: { type: string } }
      - { name: fabricId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteMatterFabric
      description: Confirmation must equal DELETE FABRIC followed by target ID and Fabric ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Updated Matter Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/factory-reset:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: factoryResetMatterTarget
      description: Clears Matter Fabric identity through the runtime and encrypted KV namespace. Confirmation must equal FACTORY RESET followed by target ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Factory-reset Matter Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/commands:
    get:
      operationId: listCommands
      responses: { "200": { description: Bounded in-memory command history, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
  /api/v1/commands/{commandId}:
    parameters: [{ name: commandId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getCommand
      responses: { "200": { description: Command lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homeloom_session
  parameters:
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string } }
    EndpointId: { name: endpointId, in: path, required: true, schema: { type: string } }
    CapabilityId: { name: capabilityId, in: path, required: true, schema: { type: string } }
    PropertyId: { name: propertyId, in: path, required: true, schema: { type: string } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unprocessable: { description: Unsupported device operation, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unavailable: { description: Provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
    AuthStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [initialized, authenticated]
          properties:
            initialized: { type: boolean }
            authenticated: { type: boolean }
            username: { type: string }
    ConfirmationRequest:
      type: object
      required: [confirmation]
      properties: { confirmation: { type: string } }
    MasterKeyRotationRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, const: ROTATE }
        resume: { type: boolean, default: false, description: Retry the active key's interrupted re-encryption batch without allocating another key version. }
    MasterKeyStatus:
      type: object
      required: [activeVersion, retainedVersions, ciphertextsByVersion, legacyCiphertexts, needsReencryption]
      properties:
        activeVersion: { type: integer, minimum: 1 }
        retainedVersions: { type: array, items: { type: integer, minimum: 1 } }
        ciphertextsByVersion: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        legacyCiphertexts: { type: integer, minimum: 0 }
        needsReencryption: { type: boolean }
    MasterKeyStatusResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/MasterKeyStatus" } }
    MasterKeyRotation:
      type: object
      required: [previousVersion, activeVersion, reencrypted, status]
      properties:
        previousVersion: { type: integer, minimum: 1 }
        activeVersion: { type: integer, minimum: 1 }
        reencrypted: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/MasterKeyStatus" }
    MasterKeyRotationResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/MasterKeyRotation" } }
    MatterEndpointDeviceTypeRequest:
      type: object
      required: [deviceType, confirmation]
      properties:
        deviceType: { type: string, description: New Matter consumer Device Type supported by the current catalog. }
        confirmation: { type: string, description: Must equal CHANGE ENDPOINT TYPE followed by target ID, consumer device ID and device type. }
    MatterFabricSummary:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, description: Non-secret Fabric identifier accepted by the Fabric deletion endpoint. }
        label: { type: string }
    PendingRestoreResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [staged, requiresRestart, createdAt, schemaVersion]
          properties:
            staged: { type: boolean, const: true }
            requiresRestart: { type: boolean, const: true }
            createdAt: { type: string, format: date-time }
            schemaVersion: { type: integer, minimum: 1 }
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [ready, database]
          properties:
            ready: { type: boolean }
            database: { type: string, enum: [ok, unavailable] }
            error: { type: string }
    TargetIssue:
      type: object
      required: [stage, message]
      properties:
        deviceId: { type: string }
        deviceName: { type: string }
        deviceType: { type: string }
        stage: { type: string, description: Projection stage such as consumer-projection, consumer-contract, or unsupported-type. }
        message: { type: string }
    TargetDiagnostics:
      type: object
      additionalProperties: { type: string }
      description: Sanitized bridge diagnostics, for example skippedAccessories and publishedAccessories counts.
    ObjectResponse:
      type: object
      required: [data]
      properties: { data: {} }
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [version, commit, buildTime, goVersion]
          properties:
            version: { type: string }
            commit: { type: string }
            buildTime: { type: string }
            goVersion: { type: string }
    RuntimeSettings:
      type: object
      required: [commandTimeoutSeconds, commandHistoryLimit]
      properties:
        commandTimeoutSeconds: { type: integer, minimum: 1, maximum: 300, description: Applied only to commands created after the update. }
        commandHistoryLimit: { type: integer, minimum: 100, maximum: 10000, description: Maximum in-memory command records; lowering it immediately removes the oldest terminal records. }
    AIServiceConfigInput:
      type: object
      properties:
        apiBaseUrl: { type: string, format: uri, description: OpenAI-compatible Responses or Chat Completions API base URL. }
        apiProxyUrl: { type: string, maxLength: 2048, description: Optional unauthenticated HTTP(S) forward proxy used only for AI provider requests. An empty value clears the dedicated proxy. }
        apiKey: { type: string, writeOnly: true, description: Stored only by the MCP Agent; omit to keep the existing key. }
        model: { type: string, maxLength: 512 }
        apiProtocol: { type: string, enum: [responses, chat-completions], default: responses }
        agentInstructions: { type: string, maxLength: 16384, description: Editable Agent system prompt. Submit an empty value to restore the default prompt. }
    AIServiceStatus:
      type: object
      required: [apiBaseUrl, apiProxyUrl, model, apiProtocol, agentInstructions, defaultAgentInstructions, apiKeyConfigured, configured]
      properties:
        apiBaseUrl: { type: string, format: uri }
        apiProxyUrl: { type: string, maxLength: 2048, description: Configured unauthenticated HTTP(S) forward proxy, or an empty string when none is configured. }
        model: { type: string }
        apiProtocol: { type: string, enum: [responses, chat-completions] }
        agentInstructions: { type: string, description: Effective Agent system prompt. }
        defaultAgentInstructions: { type: string, description: Built-in prompt used by the restore-default control. }
        apiKeyConfigured: { type: boolean }
        configured: { type: boolean, description: True only when both a key and model are configured. }
    AIModel:
      type: object
      required: [id]
      properties: { id: { type: string } }
    AIRunAction:
      type: object
      required: [deviceId, endpointId, capabilityId, propertyId, value]
      properties:
        deviceId: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
        value: { $ref: "#/components/schemas/PropertyValue" }
        expectedStateVersion: { type: integer, format: int64 }
        deviceName: { type: string }
        propertyName: { type: string }
        usageNote: { type: string, description: Untrusted device/property context supplied to the Agent. }
    AIRun:
      type: object
      required: [id, status, message, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [completed, awaiting_approval, executed, failed] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        action: { $ref: "#/components/schemas/AIRunAction" }
    AIAutomationTrigger:
      type: object
      required: [deviceId, endpointId, capabilityId, propertyId, value]
      properties:
        deviceId: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
        value: { $ref: "#/components/schemas/PropertyValue" }
    AIAutomationInput:
      type: object
      required: [name, enabled, kind, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        kind: { type: string, enum: [schedule, trigger] }
        prompt: { type: string, minLength: 1, maxLength: 16384 }
        executionMode: { type: string, enum: [unattended, manual], default: unattended, description: Unattended tasks automatically approve an AI-prepared device plan after Core policy checks. }
        intervalSeconds: { type: integer, minimum: 60, maximum: 604800, description: Required for schedule tasks. }
        cooldownSeconds: { type: integer, minimum: 60, maximum: 604800, description: Required for trigger tasks. }
        trigger: { $ref: "#/components/schemas/AIAutomationTrigger" }
    AIAutomation:
      allOf:
        - { $ref: "#/components/schemas/AIAutomationInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            lastRunId: { type: string }
            lastRunStatus: { type: string }
            lastRunMessage: { type: string }
            lastRunAt: { type: string, format: date-time }
            runHistory: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AIAutomationRun" } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AIAutomationRun:
      type: object
      required: [id, status, message]
      properties:
        id: { type: string }
        source: { type: string, enum: [manual, schedule, trigger] }
        status: { type: string }
        message: { type: string }
        autoApproved: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        action: { $ref: "#/components/schemas/AIRunAction" }
    MCPDeviceConfigInput:
      type: object
      required: [enabled, usageNote, defaultAccess]
      properties:
        enabled: { type: boolean, description: Device must be explicitly enabled before any property can be exposed to MCP. }
        usageNote: { type: string, maxLength: 1000, description: Untrusted business context given to the Agent; it never changes Core policy. }
        defaultAccess: { type: string, enum: [hidden, read, confirm] }
    MCPDeviceConfig:
      allOf:
        - { $ref: "#/components/schemas/MCPDeviceConfigInput" }
        - type: object
          required: [deviceId]
          properties: { deviceId: { type: string } }
    MCPPropertyConfigInput:
      type: object
      required: [usageNote, access]
      properties:
        usageNote: { type: string, maxLength: 1000, description: Untrusted business context given to the Agent; it never changes Core policy. }
        access: { type: string, enum: [inherit, hidden, read, confirm] }
    MCPPropertyConfig:
      allOf:
        - { $ref: "#/components/schemas/MCPPropertyConfigInput" }
        - type: object
          required: [deviceId, endpointId, capabilityId, propertyId]
          properties:
            deviceId: { type: string }
            endpointId: { type: string }
            capabilityId: { type: string }
            propertyId: { type: string }
    SubprocessLogEntry:
      type: object
      required: [sequence, time, process, instance, message]
      properties:
        sequence: { type: integer, minimum: 1 }
        time: { type: string, format: date-time }
        process: { type: string, enum: [camera-kernel, matter] }
        instance: { type: string }
        component: { type: string, description: Structured logger component name. }
        module: { type: string, description: Structured logger module name. }
        facility: { type: string, description: Matter.js facility when present. }
        subsystem: { type: string, description: Classified child subsystem such as homekit or ffmpeg. }
        level: { type: string }
        message: { type: string, description: Redacted child-process message. }
        error: { type: string, description: Redacted structured error text. }
    ExportTargetConfig:
      type: object
      required: [id, type, name, enabled, deviceIds, devices]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        address: { type: string }
        setupId: { type: string }
        matterConfig: { $ref: "#/components/schemas/MatterConfigPublic" }
        deviceIds: { type: array, deprecated: true, description: Compatibility view containing enabled unified source device IDs., items: { type: string } }
        devices: { type: array, items: { $ref: "#/components/schemas/TargetVirtualDevice" } }
    ConfigurationExport:
      type: object
      required: [formatVersion, generatedAt, providers, targets, settings, profiles, bindings, customModelProperties, modelEnumOverrides]
      properties:
        formatVersion: { type: integer, enum: [1] }
        generatedAt: { type: string, format: date-time }
        providers: { type: array, items: { type: object, additionalProperties: true } }
        targets: { type: array, items: { $ref: "#/components/schemas/ExportTargetConfig" } }
        settings: { $ref: "#/components/schemas/RuntimeSettings" }
        profiles: { type: array, items: { $ref: "#/components/schemas/MappingProfileInfo" } }
        bindings: { type: array, items: { $ref: "#/components/schemas/MappingBinding" } }
        customModelProperties: { type: array, items: { $ref: "#/components/schemas/CustomModelProperty" } }
        modelEnumOverrides: { type: array, items: { $ref: "#/components/schemas/ModelEnumOverride" } }
    DiagnosticBundle:
      type: object
      required: [formatVersion, generatedAt, build, metrics, configuration, recentAudit]
      properties:
        formatVersion: { type: integer, enum: [1] }
        generatedAt: { type: string, format: date-time }
        build: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        configuration: { $ref: "#/components/schemas/ConfigurationExport" }
        recentAudit: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    MappingTransform:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [invert, reciprocal, int-number, scale, clamp, enum, unit, range-enum, enum-number, threshold, bool-number, bool-enum, enum-bool, map-range, round, parse-number, number-string] }
        factor: { type: number }
        offset: { type: number }
        min: { type: number }
        max: { type: number }
        values: { type: object, additionalProperties: { type: string }, description: Forward enum map from source to target. Multiple sources may share one target when reverseValues provides a canonical reverse source for that target. }
        reverseValues: { type: object, additionalProperties: { type: string }, description: Optional reverse enum map from target to a canonical source. Required for every target that is produced by more than one source. }
        fromUnit: { type: string, enum: [celsius, fahrenheit, kelvin, mired, ratio, percent] }
        toUnit: { type: string, enum: [celsius, fahrenheit, kelvin, mired, ratio, percent] }
        bands:
          type: array
          items: { $ref: "#/components/schemas/MappingRangeBand" }
        threshold: { type: number }
        operator: { type: string, enum: [gte, gt, lte, lt] }
        trueNumber: { type: number }
        falseNumber: { type: number }
        trueValue: { type: string }
        falseValue: { type: string }
        inputMin: { type: number }
        inputMax: { type: number }
        outputMin: { type: number }
        outputMax: { type: number }
        mode: { type: string, enum: [nearest, floor, ceil] }
    MappingRangeBand:
      type: object
      required: [value, reverse]
      properties:
        max: { type: number, description: Inclusive upper bound. Omit only on the final catch-all band. }
        value: { type: string }
        reverse: { type: number, description: Canonical numeric representation used when converting the enum value to a number. }
    MappingProfile:
      type: object
      required: [schemaVersion, id, version, kind, inputType, outputType, transforms]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [provider, capability, target] }
        inputType: { type: string, enum: [bool, int, number, string, enum] }
        outputType: { type: string, enum: [bool, int, number, string, enum] }
        default: { $ref: "#/components/schemas/PropertyValue" }
        transforms: { type: array, items: { $ref: "#/components/schemas/MappingTransform" } }
    MappingProfileInfo:
      allOf:
        - { $ref: "#/components/schemas/MappingProfile" }
        - { type: object, required: [builtIn], properties: { builtIn: { type: boolean } } }
    MappingPreviewRequest:
      type: object
      required: [direction, value]
      properties:
        profileId: { type: string, description: Resolves the latest built-in or database snapshot. Takes precedence over profile. }
        profile: { $ref: "#/components/schemas/MappingProfile" }
        direction: { type: string, enum: [forward, reverse] }
        value:
          oneOf:
            - { $ref: "#/components/schemas/PropertyValue" }
            - { type: "null" }
    MappingStep:
      type: object
      required: [index, transform, input, output]
      properties:
        index: { type: integer }
        transform: { type: string }
        input:
          oneOf:
            - { $ref: "#/components/schemas/PropertyValue" }
            - { type: "null" }
        output: { $ref: "#/components/schemas/PropertyValue" }
    MappingPreviewResult:
      type: object
      required: [profileId, profileVersion, direction, value, steps]
      properties:
        profileId: { type: string }
        profileVersion: { type: integer }
        direction: { type: string, enum: [forward, reverse] }
        value: { $ref: "#/components/schemas/PropertyValue" }
        steps: { type: array, items: { $ref: "#/components/schemas/MappingStep" } }
    PropertyValue:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bool, int, number, string, enum] }
        bool: { type: boolean }
        int: { type: integer, format: int64 }
        number: { type: number }
        string: { type: string }
    StateValue:
      type: object
      required: [key, value, providerId, source, observedAt, receivedAt, sequence, version, quality, known, available]
      properties:
        key:
          type: object
          required: [deviceId, endpointId, capabilityId, propertyId]
          properties:
            deviceId: { type: string }
            endpointId: { type: string }
            capabilityId: { type: string }
            propertyId: { type: string }
        value:
          oneOf:
            - { type: "null", description: No trustworthy value has ever been observed. }
            - { $ref: "#/components/schemas/StateTypedValue" }
        providerId: { type: string }
        source: { type: string, enum: [reported, polled, optimistic, persistent-cache, unknown] }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        quality: { type: string, enum: [confirmed, reported, polled, optimistic, stale, unknown] }
        known: { type: boolean }
        available: { type: boolean }
        unavailableReason: { type: string, enum: [never-reported, device-offline, availability-unknown, disabled, removed, expired, command-unconfirmed, stale] }
        traceId: { type: string, description: Core event trace ID or originating command correlation ID. }
        pendingCommandId: { type: string }
    StateTypedValue:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [bool, int, number, string, enum] }
        bool: { type: boolean }
        int: { type: integer, format: int64 }
        number: { type: number }
        string: { type: string }
    Property:
      type: object
      required: [definition, value]
      properties:
        definition: { type: object, additionalProperties: true }
        value: { $ref: "#/components/schemas/PropertyValue" }
        stateTransport: { type: string, enum: [pending, local-mqtt, cloud-mqtt, cloud-http], description: Most recent acquisition path for this property. }
    ParameterRole:
      type: object
      required: [level, behavior]
      properties:
        level: { type: string, enum: [required, optional, custom] }
        behavior: { type: string }
    ModelParameter:
      type: object
      required: [path, name, level, type, readable, writable, notifiable, publisher, consumer]
      properties:
        path:
          type: object
          required: [endpointId, capabilityId, propertyId]
          properties:
            endpointId: { type: string }
            capabilityId: { type: string }
            propertyId: { type: string }
        name: { type: string }
        level: { type: string, enum: [required, optional, custom] }
        type: { type: string, enum: [bool, int, number, string, enum] }
        unit: { type: string }
        readable: { type: boolean }
        writable: { type: boolean }
        notifiable: { type: boolean }
        enum: { type: array, items: { type: string } }
        publisher: { $ref: "#/components/schemas/ParameterRole" }
        consumer: { $ref: "#/components/schemas/ParameterRole" }
    DeviceModelContract:
      type: object
      required: [deviceType, version, builtIn, parameters, custom]
      properties:
        deviceType: { type: string, description: Unified source model type containing the selected model path. }
        consumerDeviceType: { type: string, description: Consumer-owned virtual-device type; defaults to deviceType for existing same-type bindings. }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        builtIn: { type: boolean }
        parameters: { type: array, items: { $ref: "#/components/schemas/ModelParameter" } }
        custom:
          type: object
          required: [publisher, consumer]
          properties:
            publisher: { $ref: "#/components/schemas/ParameterRole" }
            consumer: { $ref: "#/components/schemas/ParameterRole" }
    ModelPath:
      type: object
      required: [endpointId, capabilityId, propertyId]
      properties:
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
    MappingBinding:
      type: object
      required: [id, stage, modelEndpointId, modelCapabilityId, modelPropertyId, enabled]
      properties:
        id: { type: string }
        stage: { type: string, enum: [provider, consumer] }
        profileId: { type: string, description: Empty or omitted means identity conversion. }
        providerId: { type: string, description: Required for both stages; every route belongs to one concrete Provider device. }
        deviceId: { type: string, description: Required for both stages; mappings are never inherited by other devices of the same type. }
        endpointId: { type: string, description: Raw Provider endpoint. }
        capabilityId: { type: string, description: Raw Provider capability. }
        propertyId: { type: string, description: Raw Provider property. }
        deviceType: { type: string }
        modelEndpointId: { type: string }
        modelCapabilityId: { type: string }
        modelPropertyId: { type: string }
        consumerId: { type: string }
        targetId: { type: string, description: Concrete Target bridge ID for a bridge-owned Consumer route. Must be supplied with consumerDeviceId. }
        consumerDeviceId: { type: string, description: Concrete virtual-device ID within targetId. Makes Consumer mappings independent per bridge device. }
        consumerProperty: { type: string }
        enabled: { type: boolean }
    LogicalSourceRef:
      type: object
      required: [providerId, deviceId]
      properties:
        providerId: { type: string }
        deviceId: { type: string }
    LogicalPropertyPath:
      type: object
      required: [endpointId, capabilityId, propertyId]
      properties:
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
    LogicalCommandPath:
      type: object
      required: [endpointId, capabilityId, commandId]
      properties:
        endpointId: { type: string }
        capabilityId: { type: string }
        commandId: { type: string }
    LogicalDevice:
      type: object
      required: [id, name, type, bindings]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        bindings:
          type: array
          minItems: 2
          items: { allOf: [{ $ref: "#/components/schemas/LogicalSourceRef" }, { type: object, required: [priority], properties: { priority: { type: integer, minimum: 0, maximum: 1000 } } }] }
        propertyRoutes: { type: array, items: { type: object, required: [path, candidates], properties: { path: { $ref: "#/components/schemas/LogicalPropertyPath" }, candidates: { type: array, minItems: 1, items: { type: object, additionalProperties: true } } } } }
        commandRoutes: { type: array, items: { type: object, required: [path, candidates], properties: { path: { $ref: "#/components/schemas/LogicalCommandPath" }, candidates: { type: array, minItems: 1, items: { type: object, additionalProperties: true } } } } }
    LogicalDeviceCandidate:
      type: object
      required: [left, right, reasons]
      properties:
        left: { allOf: [{ $ref: "#/components/schemas/LogicalSourceRef" }, { type: object, required: [name, type], properties: { name: { type: string }, type: { type: string }, homeId: { type: string }, roomId: { type: string } } }] }
        right: { allOf: [{ $ref: "#/components/schemas/LogicalSourceRef" }, { type: object, required: [name, type], properties: { name: { type: string }, type: { type: string }, homeId: { type: string }, roomId: { type: string } } }] }
        reasons: { type: array, items: { type: string } }
    LogicalRouteExplanation:
      type: object
      required: [logicalDeviceId, kind, path, reason, selected, candidates]
      properties:
        logicalDeviceId: { type: string }
        kind: { type: string, enum: [property, command] }
        path: { type: string }
        reason: { type: string, enum: [provider_priority, safe_fallback_provider_unavailable, all_sources_unavailable] }
        selected: { type: object, additionalProperties: true }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
    CustomModelProperty:
      type: object
      required: [id, deviceType, endpointId, endpointName, endpointType, capabilityId, capabilityType, definition]
      properties:
        id: { type: string }
        deviceType: { type: string }
        endpointId: { type: string }
        endpointName: { type: string }
        endpointType: { type: string }
        capabilityId: { type: string }
        capabilityType: { type: string }
        definition: { type: object, additionalProperties: true }
    ModelEnumOverride:
      type: object
      required: [deviceType, endpointId, capabilityId, propertyId, enum]
      properties:
        id: { type: string, description: "Stable override ID. Generated as enum-{deviceType}-{endpoint}-{capability}-{property} when omitted." }
        deviceType: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
        enum: { type: array, items: { type: string }, minItems: 1, uniqueItems: true, description: Replacement enum options for the unified-model property. }
    ConsumerProperty:
      type: object
      required: [id, name, deviceType, defaultModelPath, level, type, readable, writable, notifiable]
      properties:
        id: { type: string }
        name: { type: string }
        deviceType: { type: string }
        defaultModelPath: { $ref: "#/components/schemas/ModelPath" }
        level: { type: string, enum: [required, optional, custom] }
        type: { type: string, enum: [bool, int, number, string, enum] }
        unit: { type: string }
        min: { type: number }
        max: { type: number }
        step: { type: number, exclusiveMinimum: 0 }
        enum: { type: array, items: { type: string } }
        readable: { type: boolean }
        writable: { type: boolean }
        notifiable: { type: boolean }
    ConsumerCatalog:
      type: object
      required: [id, name, properties]
      properties:
        id: { type: string }
        name: { type: string }
        properties: { type: array, items: { $ref: "#/components/schemas/ConsumerProperty" } }
    MappingCatalog:
      type: object
      required: [providers, models, consumers]
      properties:
        providers: { type: array, items: { $ref: "#/components/schemas/SourceCatalogDevice" } }
        models: { type: array, items: { $ref: "#/components/schemas/DeviceModelContract" } }
        consumers:
          type: array
          items: { $ref: "#/components/schemas/ConsumerCatalog" }
    SourceCatalogDevice:
      allOf:
        - { $ref: "#/components/schemas/Device" }
        - type: object
          required: [catalog]
          properties:
            catalog: { $ref: "#/components/schemas/SourceCatalogMetadata" }
    SourceCatalogMetadata:
      type: object
      required: [complete, source]
      properties:
        complete: { type: boolean, description: True only when the Provider enumerated the native device schema rather than mirroring configured mappings. }
        source: { type: string, enum: [provider-discovery, miot-spec.org, miot-spec-cache, configured-mapping-fallback, unified-registry-fallback] }
        specType: { type: string, description: Resolved MIoT instance URN when applicable. }
        model: { type: string }
        fetchedAt: { type: string, format: date-time }
        error: { type: string, description: Why a complete native catalog could not be produced. }
        values:
          type: object
          description: Ephemeral per-property value status keyed by endpoint/capability/property. Values are rebuilt from Provider reads and events after restart.
          additionalProperties: { $ref: "#/components/schemas/SourceValueStatus" }
    SourceValueStatus:
      type: object
      required: [known, available]
      properties:
        known: { type: boolean, description: False means the typed value in the property document is only an initialization placeholder. }
        available: { type: boolean, description: True when the value was read or observed while the source device was available. }
        observedAt: { type: string, format: date-time }
        error: { type: string, description: Most recent read error when the value is unavailable. }
    DeviceLocationRoom:
      type: object
      required: [id, homeId, name]
      properties:
        id: { type: string }
        homeId: { type: string }
        name: { type: string }
    DeviceLocationHome:
      type: object
      required: [id, name, rooms]
      properties:
        id: { type: string }
        name: { type: string }
        rooms: { type: array, items: { $ref: "#/components/schemas/DeviceLocationRoom" } }
    Device:
      type: object
      required: [schemaVersion, id, providerId, name, type, availability, online, endpoints, lastUpdateAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string }
        providerId: { type: string }
        name: { type: string }
        type: { type: string }
        homeId: { type: string, description: Effective canonical home identity used by unified-device grouping; a matching Provider source name resolves to the HomeLoom ID. }
        homeName: { type: string, description: Effective HomeLoom home name. }
        roomId: { type: string, description: Effective canonical room identity scoped to the home; a matching Provider source name resolves to the HomeLoom ID. }
        roomName: { type: string, description: Effective HomeLoom room name. }
        locationMode: { type: string, enum: [source, custom], description: Whether the effective location follows the Provider or a HomeLoom-owned override. }
        sourceHomeId: { type: string, description: Read-only home identity reported by the Provider. }
        sourceHomeName: { type: string, description: Read-only home name reported by the Provider. }
        sourceRoomId: { type: string, description: Read-only room identity reported by the Provider. }
        sourceRoomName: { type: string, description: Read-only room name reported by the Provider. }
        availability: { type: string, enum: [online, offline, unknown] }
        online: { type: boolean }
        sequence: { type: integer, minimum: 0, description: Provider-local snapshot sequence when available. }
        disabled: { type: boolean, description: Persisted operator preference; Provider events cannot make the device online while true. }
        removed: { type: boolean, description: Tombstone retained after the Provider removes the device identity. }
        runtimeMode: { type: string, enum: [pending, local, cloud], description: Actual runtime source selected by transport-aware Providers; Xiaomi MIoT Cloud reports local after a successful LAN sync and cloud after cloud polling or auto fallback. }
        stateTransport: { type: string, enum: [pending, local-mqtt, cloud-mqtt, cloud-http], description: Precise state acquisition path; the Xiaomi central Provider distinguishes gateway push, official cloud push, and official cloud HTTP calibration. }
        endpoints: { type: array, items: { type: object, additionalProperties: true } }
        lastUpdateAt: { type: string, format: date-time }
    DeviceEvent:
      type: object
      required: [providerId, deviceId, endpointId, capabilityId, eventId, payload, observedAt, sequence]
      properties:
        providerId: { type: string }
        deviceId: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        eventId: { type: string }
        name: { type: string }
        payload: { description: Provider-native event arguments preserved as JSON. }
        observedAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
    DeviceCommandResponse:
      type: object
      required: [data, command]
      properties:
        data: { $ref: "#/components/schemas/Device" }
        command: { $ref: "#/components/schemas/Command" }
    Command:
      type: object
      required: [id, deviceId, endpointId, capabilityId, status, createdAt, updatedAt, deadline]
      properties:
        id: { type: string }
        kind: { type: string, enum: [property, action] }
        deviceId: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
        commandId: { type: string }
        correlationId: { type: string, maxLength: 128, description: HTTP X-Request-Id that created the command. }
        coalescedRequests: { type: integer, minimum: 1, description: Number of later identical property writes that reused this command. }
        status: { type: string, enum: [queued, sent, accepted, confirmed, rejected, timeout, superseded] }
        outcome: { type: string, enum: [succeeded, failed, unknown] }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, correlationId, actor, action, resourceType, method, route, status, outcome, createdAt]
      properties:
        id: { type: integer, format: int64 }
        correlationId: { type: string, maxLength: 128 }
        actor: { type: string, example: local-api }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        method: { type: string }
        route: { type: string, description: Templated route; request bodies are never recorded. }
        status: { type: integer }
        outcome: { type: string, enum: [succeeded, failed] }
        createdAt: { type: string, format: date-time }
    ProviderInput:
      type: object
      required: [type, name, enabled, config]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: Sensitive values are returned as ********; submit the placeholder unchanged to preserve the stored value. }
    ProviderDiscoveryCandidate:
      type: object
      required: [providerType, name, host, port, mac]
      properties:
        id: { type: string }
        providerType: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        mac: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    ProviderAuthChallenge:
      type: object
      required: [status, challengeId, verificationUrl, expiresAt]
      properties:
        status: { type: string, enum: [auth_required] }
        challengeId: { type: string }
        verificationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    ProviderAuthChallengeVerification:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 1, maxLength: 32 }
    XiaomiOAuthStart:
      type: object
      required: [clientId, region]
      properties:
        clientId: { type: string, pattern: "^[0-9]+$", description: Authorized Xiaomi OAuth application ID. }
        region: { type: string, example: cn }
        redirectUrl: { type: string, format: uri, const: "http://homeassistant.local:8123", default: "http://homeassistant.local:8123", description: Fixed Xiaomi OAuth redirect URI; any supplied value is normalized to this URI. }
        oauthUuid: { type: string, pattern: "^[0-9a-f]{32}$" }
        virtualDid: { type: string, pattern: "^[0-9]+$" }
    XiaomiCloudLoginStart:
      type: object
      required: [region, username, password]
      properties:
        region: { type: string, enum: [cn, de, i2, ru, sg, tw, us, in] }
        username: { type: string }
        password: { type: string, format: password, description: Retained only in process while the live challenge is pending and encrypted only when included in a saved Provider configuration; never written to a challenge database. }
        requestTimeoutSeconds: { type: integer, minimum: 1, maximum: 120, default: 15 }
    XiaomiCloudLoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified, verification_required] }
        challengeId: { type: string }
        verificationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        userId: { type: string }
        ssecurity: { type: string }
        serviceToken: { type: string }
    XiaomiHubDevice:
      type: object
      required: [did, name]
      properties:
        did: { type: string }
        name: { type: string }
        model: { type: string }
        homeId: { type: string }
        homeName: { type: string }
        roomId: { type: string }
        roomName: { type: string }
        localIp: { type: string, description: Private LAN address reported by Xiaomi Cloud. }
        localAvailable: { type: boolean, description: Whether both a safe private address and valid local token are available; the token itself is never serialized. }
        specType: { type: string }
        online: { type: boolean }
    TargetVirtualDevice:
      type: object
      required: [id, name, type, sourceDeviceId, enabled]
      properties:
        id: { type: string, description: Stable Consumer-side device identity within one bridge. }
        name: { type: string }
        type: { type: string, description: Consumer-owned device type; may differ from every source unified-model type. }
        sourceDeviceId: { type: string, description: Primary unified-registry source. It has the highest routing priority. }
        auxiliarySourceDeviceIds: { type: array, description: Ordered auxiliary unified-registry sources aggregated into this Consumer device., items: { type: string } }
        enabled: { type: boolean }
    TargetInput:
      oneOf:
        - { $ref: "#/components/schemas/HomeKitTargetInput" }
        - { $ref: "#/components/schemas/MatterTargetInput" }
      discriminator: { propertyName: type }
    TargetInputBase:
      type: object
      required: [type, name, enabled]
      properties:
        id: { type: string }
        type: { type: string, enum: [apple-hap, matter] }
        name: { type: string }
        enabled: { type: boolean }
        deviceIds: { type: array, deprecated: true, description: Legacy source-device bindings; migrated into virtual devices when devices is empty., items: { type: string } }
        devices: { type: array, items: { $ref: "#/components/schemas/TargetVirtualDevice" } }
    HomeKitTargetInput:
      allOf:
        - { $ref: "#/components/schemas/TargetInputBase" }
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [apple-hap] }
            address: { type: string }
            pin: { type: string, pattern: '^[0-9]{8}$' }
            setupId: { type: string, minLength: 4, maxLength: 4 }
            storePath: { type: string, readOnly: true }
    MatterTargetInput:
      allOf:
        - { $ref: "#/components/schemas/TargetInputBase" }
        - type: object
          required: [type, matterConfig]
          properties:
            type: { type: string, enum: [matter] }
            matterConfig: { $ref: "#/components/schemas/MatterConfigInput" }
    MatterConfigPublic:
      type: object
      properties:
        networkInterface: { type: string }
        udpPort: { type: integer, minimum: 1024, maximum: 65535, description: Omit or use zero for automatic allocation. }
        discriminator: { type: integer, minimum: 0, maximum: 4095 }
        vendorId: { type: integer, minimum: 1, maximum: 65535 }
        productId: { type: integer, minimum: 1, maximum: 65535 }
        productName: { type: string, maxLength: 32 }
        serialNumber: { type: string, maxLength: 32 }
        commissioningWindowSeconds: { type: integer, minimum: 180, maximum: 900 }
    MatterConfigInput:
      allOf:
        - { $ref: "#/components/schemas/MatterConfigPublic" }
        - type: object
          properties:
            passcode: { type: string, format: password, pattern: '^[0-9]{8}$', description: Generated when omitted and never returned by Target list or configuration export. }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
