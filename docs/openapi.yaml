openapi: 3.1.0
info:
  title: HomeLoom API
  version: 0.1.0
  description: HomeLoom management API. Runtime device values are ephemeral; configuration is stored in PostgreSQL.
servers:
  - url: http://127.0.0.1:8090
security:
  - sessionCookie: []
paths:
  /api/versions:
    get:
      security: []
      operationId: listApiVersions
      responses:
        "200":
          description: Supported management API path versions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [current, supported, deprecated]
                    properties:
                      current: { type: string, const: v1 }
                      supported: { type: array, items: { type: string } }
                      deprecated: { type: array, items: { type: string } }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: Process is alive, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /ready:
    get:
      security: []
      operationId: ready
      responses:
        "200": { description: Required dependencies are available, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { description: A required dependency is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /api/v1/system/version:
    get:
      security: []
      operationId: getVersion
      responses:
        "200": { description: Build information, content: { application/json: { schema: { $ref: "#/components/schemas/VersionResponse" } } } }
  /api/v1/auth/status:
    get:
      security: []
      operationId: getAuthenticationStatus
      responses:
        "200": { description: Administrator initialization and current session status, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
  /api/v1/auth/setup:
    post:
      security: []
      operationId: setupAdministrator
      description: Creates the one administrator account when the database is uninitialized and starts a session.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthRequest" } } } }
      responses:
        "201": { description: Administrator created and session cookies set, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Administrator already initialized }
  /api/v1/auth/login:
    post:
      security: []
      operationId: loginAdministrator
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthRequest" } } } }
      responses:
        "200": { description: Session cookies set, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatusResponse" } } } }
        "401": { description: Invalid username or password }
        "429": { description: Client temporarily locked after repeated failures }
  /api/v1/auth/logout:
    post:
      operationId: logoutAdministrator
      description: Revokes the database session. Requires the X-CSRF-Token header.
      responses:
        "204": { description: Session revoked and cookies cleared }
        "403": { description: Invalid CSRF token }
  /api/v1/device-models:
    get:
      operationId: listDeviceModelContracts
      description: Lists versioned unified-model parameters and publisher/consumer grading policies.
      responses:
        "200":
          description: Device model contracts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DeviceModelContract" } }
  /api/v1/device-models/custom-properties:
    get:
      operationId: listCustomModelProperties
      responses: { "200": { description: Database-backed custom unified-model properties, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/CustomModelProperty" } } } } } } } }
    post:
      operationId: createCustomModelProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomModelProperty" } } } }
      responses: { "201": { description: Custom property persisted and added to the model catalog }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: ID or model path already exists } }
  /api/v1/device-models/custom-properties/{propertyId}:
    parameters: [{ name: propertyId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateCustomModelProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomModelProperty" } } } }
      responses: { "200": { description: Custom property updated }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      operationId: deleteCustomModelProperty
      responses: { "204": { description: Custom property deleted }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Property is used by a mapping route } }
  /api/v1/system/settings:
    get:
      operationId: getRuntimeSettings
      responses:
        "200": { description: Database-backed runtime settings, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RuntimeSettings" } } } } } }
    put:
      operationId: updateRuntimeSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeSettings" } } } }
      responses:
        "200": { description: Settings persisted and applied without restart, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RuntimeSettings" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/system/config-export:
    get:
      operationId: exportConfiguration
      description: Downloads a no-store configuration snapshot. Provider credentials are recursively redacted and Target PIN, setup URI, and storage path are omitted.
      responses:
        "200":
          description: Redacted configuration attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/ConfigurationExport" } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/diagnostic-bundle:
    get:
      operationId: downloadDiagnosticBundle
      description: Downloads a no-store support bundle containing build data, metrics, the redacted configuration snapshot, and body-free audit metadata.
      responses:
        "200":
          description: Redacted diagnostic attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/DiagnosticBundle" } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/system/backup:
    post:
      operationId: downloadDatabaseBackup
      description: Creates a consistent PostgreSQL logical snapshot plus its master key as a sensitive ZIP archive. Requires X-CSRF-Token and the exact BACKUP confirmation phrase.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses:
        "200": { description: No-store ZIP attachment containing homeloom-postgres.json and homeloom-master.key, content: { application/zip: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/system/restore:
    post:
      operationId: stageDatabaseRestore
      description: Validates and stages a complete backup for atomic application before the next process startup. The current database is preserved as a pre-restore snapshot and restored browser sessions are invalidated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, confirmation]
              properties:
                file: { type: string, format: binary }
                confirmation: { type: string, const: RESTORE }
      responses:
        "202": { description: Restore validated and staged, content: { application/json: { schema: { $ref: "#/components/schemas/PendingRestoreResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Another restore is already pending }
        "413": { description: Restore archive exceeds 256 MiB }
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        "200": { description: Runtime metrics snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
  /api/v1/mapping/preview:
    post:
      operationId: previewMapping
      description: Validates and executes an ephemeral mapping profile without persisting it or writing a device. Reverse direction applies reversible transforms in reverse order.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MappingPreviewRequest" } }
      responses:
        "200":
          description: Final typed value and each evaluated transform step
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/MappingPreviewResult" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/mapping/catalog:
    get:
      operationId: getMappingCatalog
      description: Returns native Provider source catalogs before Provider-to-model projection. Every Provider device includes catalog provenance and an explicit completeness flag; Xiaomi catalogs are expanded from cached MIoT Spec definitions when available.
      description: Returns unprojected Provider attributes, the merged three-level unified model catalog, and every built-in Consumer property.
      responses:
        "200": { description: Visual mapping catalog, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingCatalog" } } } } } }
  /api/v1/mapping/bindings:
    get:
      operationId: listMappingBindings
      responses: { "200": { description: Device-scoped Provider and Consumer routes, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MappingBinding" } } } } } } } }
    post:
      operationId: createMappingBinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingBinding" } } } }
      responses: { "201": { description: Route persisted and applied }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Source or model destination is already routed } }
  /api/v1/mapping/bindings/{bindingId}:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    get: { operationId: getMappingBinding, responses: { "200": { description: Mapping route }, "404": { $ref: "#/components/responses/NotFound" } } }
    put:
      operationId: updateMappingBinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingBinding" } } } }
      responses: { "200": { description: Route updated and reapplied }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete: { operationId: deleteMappingBinding, responses: { "204": { description: Route deleted and runtime refreshed }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/v1/mapping/profiles:
    get:
      operationId: listMappingProfiles
      responses: { "200": { description: Built-in and database-backed profiles, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } } } }
    post:
      operationId: createMappingProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingProfile" } } } }
      responses:
        "201": { description: Profile persisted and hot-loaded, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Profile ID already exists or is reserved by a built-in profile, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/mapping/profiles/import:
    post:
      operationId: importMappingProfiles
      description: Validates the complete batch before atomically upserting user profiles. Existing versions must increase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profiles]
              properties: { profiles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MappingProfile" } } }
      responses:
        "200": { description: Imported and hot-loaded profiles, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/mapping/profiles/export:
    get:
      operationId: exportMappingProfiles
      description: Downloads only user profiles so the artifact can be imported without colliding with built-ins.
      responses:
        "200": { description: Import-compatible no-store JSON attachment, content: { application/json: { schema: { type: object, required: [schemaVersion, profiles], properties: { schemaVersion: { type: integer, const: 1 }, profiles: { type: array, items: { $ref: "#/components/schemas/MappingProfile" } } } } } } }
  /api/v1/mapping/profiles/{profileId}:
    parameters: [{ name: profileId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMappingProfile
      responses: { "200": { description: Profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: updateMappingProfile
      description: Persists and hot-loads a version newer than the currently stored version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MappingProfile" } } } }
      responses: { "200": { description: Updated profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/MappingProfileInfo" } } } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Built-in profile is read-only } }
    delete:
      operationId: deleteMappingProfile
      responses: { "204": { description: User profile deleted from PostgreSQL and the live snapshot }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Built-in profile is read-only } }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Persisted audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/events/audit:
    get:
      operationId: streamAuditEvents
      responses:
        "200":
          description: Server-sent events named audit; heartbeat comments are emitted every 15 seconds
          content: { text/event-stream: { schema: { type: string } } }
  /api/v1/devices:
    get:
      operationId: listDevices
      responses:
        "200": { description: Device snapshots, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } } } } } }
  /api/v1/devices/{deviceId}/states:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    get:
      operationId: listDeviceStates
      responses:
        "200": { description: In-memory state with provenance and explicit unknown/unavailable semantics, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/StateValue" } } } } } } }
  /api/v1/devices/{deviceId}/enabled:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    put:
      operationId: setDeviceEnabled
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: Persisted device preference applied immediately, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Device" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/devices/{deviceId}/simulation:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    patch:
      operationId: simulateVirtualDevice
      description: Changes ephemeral Virtual Provider state; values are never persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability: { type: string, enum: [online, offline, unknown] }
                online: { type: boolean }
                power: { type: boolean }
                temperature: { type: number, minimum: -100, maximum: 200 }
                humidity: { type: number, minimum: 0, maximum: 100 }
                contact: { type: boolean }
                motion: { type: boolean }
                active: { type: boolean }
                speed: { type: number, minimum: 0, maximum: 100 }
                mode: { type: string, enum: [manual, auto] }
                filterLife: { type: number, minimum: 0, maximum: 100 }
                filterChange: { type: boolean }
                position: { type: integer, minimum: 0, maximum: 100 }
                sequence: { type: integer, minimum: 0 }
                repeat: { type: integer, minimum: 1, maximum: 10 }
              minProperties: 1
      responses:
        "200": { description: Updated ephemeral device snapshot, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Device" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/devices/{deviceId}/endpoints/{endpointId}/capabilities/{capabilityId}/properties/{propertyId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
      - { $ref: "#/components/parameters/EndpointId" }
      - { $ref: "#/components/parameters/CapabilityId" }
      - { $ref: "#/components/parameters/PropertyId" }
    get:
      operationId: readProperty
      responses:
        "200": { description: Provider property value, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Property" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: writeProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PropertyValue" } } } }
      responses:
        "200": { description: Updated device and command lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCommandResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/devices/{deviceId}/endpoints/{endpointId}/capabilities/{capabilityId}/commands/{commandId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
      - { $ref: "#/components/parameters/EndpointId" }
      - { $ref: "#/components/parameters/CapabilityId" }
      - { name: commandId, in: path, required: true, schema: { type: string } }
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
    post:
      operationId: executeCommand
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters: { type: object, additionalProperties: { $ref: "#/components/schemas/PropertyValue" } }
      responses:
        "200": { description: Updated device and action lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCommandResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Idempotency key conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/providers:
    get:
      operationId: listProviders
      responses: { "200": { description: Provider configurations and runtime status, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
    post:
      operationId: createProvider
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses: { "200": { description: Provider created, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/providers/test:
    post:
      operationId: testProviderConnection
      description: Validates configuration and connects a short-lived provider without persisting or replacing runtime state.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses:
        "200": { description: Connection and subscription succeeded, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [reachable], properties: { reachable: { type: boolean, const: true } } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/oauth/start:
    post:
      operationId: startXiaomiOAuth
      description: Generates or reuses the stable OAuth identity and returns the Xiaomi authorization URL using the fixed http://homeassistant.local:8123 redirect URI. Requires an authenticated administrator session.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/XiaomiOAuthStart" } } } }
      responses:
        "200": { description: Authorization URL, state, OAuth UUID and virtual DID, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/oauth/complete:
    post:
      operationId: completeXiaomiOAuth
      description: Accepts code and state parsed by the UI from the complete callback URL copied by the user, validates state, exchanges the authorization code, retrieves the account UID and issues an Ed25519 central-hub client certificate. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/XiaomiOAuthStart" }, { type: object, required: [code, state], properties: { code: { type: string }, state: { type: string } } }] } } } }
      responses:
        "200": { description: OAuth token metadata and in-memory PEM material to include in the encrypted Provider configuration, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi-miot-cloud/login/start:
    post:
      operationId: startXiaomiMIoTCloudLogin
      description: Starts third-party-compatible Xiaomi account login. Returns a complete session or a short-lived in-memory challenge that preserves the original Xiaomi cookie jar for SMS/email verification. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/XiaomiCloudLoginStart" } } } }
      responses:
        "200": { description: Complete cloud session or identity-verification challenge, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/XiaomiCloudLoginResult" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi-miot-cloud/login/verify:
    post:
      operationId: verifyXiaomiMIoTCloudLogin
      description: Submits the SMS/email code into the retained Xiaomi login session. The challenge is single-use after success, expires after ten minutes and allows at most five attempts. The response is marked no-store.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId, code], properties: { challengeId: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: Complete Xiaomi cloud session, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/XiaomiCloudLoginResult" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/gateways:
    get:
      operationId: discoverXiaomiCentralGateways
      description: Browses `_miot-central._tcp.local.` for five seconds and returns role/MQTT capability metadata from the mDNS profile.
      responses:
        "200": { description: Discovered central hubs, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/xiaomi/providers/{providerId}/devices:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: discoverXiaomiHubDevices
      description: Reuses the established MQTT connection of an enabled, running Xiaomi Provider and returns its central-hub subdevice directory. OAuth/certificate provisioning and Provider connection must already be complete.
      responses:
        "200": { description: Central gateway device directory, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/XiaomiHubDevice" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Xiaomi Provider is not enabled and connected }
  /api/v1/xiaomi-miot-cloud/providers/{providerId}/devices:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: discoverXiaomiMIoTCloudDevices
      description: Reuses the active xiaomi-miot-cloud account session and returns its Xiaomi account device directory. This is the third-party-compatible hass-xiaomi-miot style API, not the reserved future official Xiaomi Home Cloud Provider.
      responses:
        "200": { description: Xiaomi MIoT cloud account device directory, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/XiaomiHubDevice" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Xiaomi MIoT cloud Provider is not enabled and connected }
  /api/v1/providers/{providerId}:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateProvider
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderInput" } } } }
      responses: { "200": { description: Provider updated, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
    delete:
      operationId: deleteProvider
      responses: { "204": { description: Provider deleted }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/providers/{providerId}/restart:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: restartProvider
      responses: { "200": { description: Provider restarted, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets:
    get:
      operationId: listTargets
      responses: { "200": { description: Target configurations and status, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
    post:
      operationId: createTarget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TargetInput" } } } }
      responses: { "200": { description: Target created, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets/{targetId}:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateTarget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TargetInput" } } } }
      responses: { "200": { description: Target updated, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" } }
    delete:
      operationId: deleteTarget
      responses: { "204": { description: Target deleted }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/targets/{targetId}/pairing/regenerate:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: regenerateTargetPairing
      description: Generates a new HomeKit PIN and Setup ID while preserving the existing HAP controller identity. Confirmation must equal REGENERATE followed by the target ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Updated Target }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/targets/{targetId}/pairing-identity:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: clearTargetPairingIdentity
      description: Stops the bridge, safely removes HAP keys and controller pairings, then rebuilds it. Confirmation must equal CLEAR followed by the target ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmationRequest" } } } }
      responses: { "200": { description: Target rebuilt with a fresh pairing identity }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/commands:
    get:
      operationId: listCommands
      responses: { "200": { description: Bounded in-memory command history, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } } }
  /api/v1/commands/{commandId}:
    parameters: [{ name: commandId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getCommand
      responses: { "200": { description: Command lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectResponse" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homeloom_session
  parameters:
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string } }
    EndpointId: { name: endpointId, in: path, required: true, schema: { type: string } }
    CapabilityId: { name: capabilityId, in: path, required: true, schema: { type: string } }
    PropertyId: { name: propertyId, in: path, required: true, schema: { type: string } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unprocessable: { description: Unsupported device operation, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unavailable: { description: Provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
    AuthStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [initialized, authenticated]
          properties:
            initialized: { type: boolean }
            authenticated: { type: boolean }
            username: { type: string }
    ConfirmationRequest:
      type: object
      required: [confirmation]
      properties: { confirmation: { type: string } }
    PendingRestoreResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [staged, requiresRestart, createdAt, schemaVersion]
          properties:
            staged: { type: boolean, const: true }
            requiresRestart: { type: boolean, const: true }
            createdAt: { type: string, format: date-time }
            schemaVersion: { type: integer, minimum: 1 }
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [ready, database]
          properties:
            ready: { type: boolean }
            database: { type: string, enum: [ok, unavailable] }
            error: { type: string }
    ObjectResponse:
      type: object
      required: [data]
      properties: { data: {} }
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [version, commit, buildTime, goVersion]
          properties:
            version: { type: string }
            commit: { type: string }
            buildTime: { type: string }
            goVersion: { type: string }
    RuntimeSettings:
      type: object
      required: [commandTimeoutSeconds, commandHistoryLimit]
      properties:
        commandTimeoutSeconds: { type: integer, minimum: 1, maximum: 300, description: Applied only to commands created after the update. }
        commandHistoryLimit: { type: integer, minimum: 100, maximum: 10000, description: Maximum in-memory command records; lowering it immediately removes the oldest terminal records. }
    ExportTargetConfig:
      type: object
      required: [id, type, name, enabled, deviceIds, devices]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        address: { type: string }
        setupId: { type: string }
        deviceIds: { type: array, deprecated: true, description: Compatibility view containing enabled unified source device IDs., items: { type: string } }
        devices: { type: array, items: { $ref: "#/components/schemas/TargetVirtualDevice" } }
    ConfigurationExport:
      type: object
      required: [formatVersion, generatedAt, providers, targets, settings, profiles, bindings, customModelProperties]
      properties:
        formatVersion: { type: integer, enum: [1] }
        generatedAt: { type: string, format: date-time }
        providers: { type: array, items: { type: object, additionalProperties: true } }
        targets: { type: array, items: { $ref: "#/components/schemas/ExportTargetConfig" } }
        settings: { $ref: "#/components/schemas/RuntimeSettings" }
        profiles: { type: array, items: { $ref: "#/components/schemas/MappingProfileInfo" } }
        bindings: { type: array, items: { $ref: "#/components/schemas/MappingBinding" } }
        customModelProperties: { type: array, items: { $ref: "#/components/schemas/CustomModelProperty" } }
    DiagnosticBundle:
      type: object
      required: [formatVersion, generatedAt, build, metrics, configuration, recentAudit]
      properties:
        formatVersion: { type: integer, enum: [1] }
        generatedAt: { type: string, format: date-time }
        build: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        configuration: { $ref: "#/components/schemas/ConfigurationExport" }
        recentAudit: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    MappingTransform:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [invert, scale, clamp, enum, unit, range-enum, threshold, bool-enum, enum-bool, map-range, round, parse-number, number-string] }
        factor: { type: number }
        offset: { type: number }
        min: { type: number }
        max: { type: number }
        values: { type: object, additionalProperties: { type: string } }
        fromUnit: { type: string, enum: [celsius, fahrenheit, kelvin, ratio, percent] }
        toUnit: { type: string, enum: [celsius, fahrenheit, kelvin, ratio, percent] }
        bands:
          type: array
          items: { $ref: "#/components/schemas/MappingRangeBand" }
        threshold: { type: number }
        operator: { type: string, enum: [gte, gt, lte, lt] }
        trueNumber: { type: number }
        falseNumber: { type: number }
        trueValue: { type: string }
        falseValue: { type: string }
        inputMin: { type: number }
        inputMax: { type: number }
        outputMin: { type: number }
        outputMax: { type: number }
        mode: { type: string, enum: [nearest, floor, ceil] }
    MappingRangeBand:
      type: object
      required: [value, reverse]
      properties:
        max: { type: number, description: Inclusive upper bound. Omit only on the final catch-all band. }
        value: { type: string }
        reverse: { type: number, description: Canonical Provider value used for reverse writes. }
    MappingProfile:
      type: object
      required: [schemaVersion, id, version, kind, inputType, outputType, transforms]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [provider, capability, target] }
        inputType: { type: string, enum: [bool, int, number, string, enum] }
        outputType: { type: string, enum: [bool, int, number, string, enum] }
        default: { $ref: "#/components/schemas/PropertyValue" }
        transforms: { type: array, items: { $ref: "#/components/schemas/MappingTransform" } }
    MappingProfileInfo:
      allOf:
        - { $ref: "#/components/schemas/MappingProfile" }
        - { type: object, required: [builtIn], properties: { builtIn: { type: boolean } } }
    MappingPreviewRequest:
      type: object
      required: [direction, value]
      properties:
        profileId: { type: string, description: Resolves the latest built-in or database snapshot. Takes precedence over profile. }
        profile: { $ref: "#/components/schemas/MappingProfile" }
        direction: { type: string, enum: [forward, reverse] }
        value:
          oneOf:
            - { $ref: "#/components/schemas/PropertyValue" }
            - { type: "null" }
    MappingStep:
      type: object
      required: [index, transform, input, output]
      properties:
        index: { type: integer }
        transform: { type: string }
        input:
          oneOf:
            - { $ref: "#/components/schemas/PropertyValue" }
            - { type: "null" }
        output: { $ref: "#/components/schemas/PropertyValue" }
    MappingPreviewResult:
      type: object
      required: [profileId, profileVersion, direction, value, steps]
      properties:
        profileId: { type: string }
        profileVersion: { type: integer }
        direction: { type: string, enum: [forward, reverse] }
        value: { $ref: "#/components/schemas/PropertyValue" }
        steps: { type: array, items: { $ref: "#/components/schemas/MappingStep" } }
    PropertyValue:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bool, int, number, string, enum] }
        bool: { type: boolean }
        int: { type: integer, format: int64 }
        number: { type: number }
        string: { type: string }
    StateValue:
      type: object
      required: [key, value, providerId, source, observedAt, receivedAt, sequence, version, quality, known, available]
      properties:
        key:
          type: object
          required: [deviceId, endpointId, capabilityId, propertyId]
          properties:
            deviceId: { type: string }
            endpointId: { type: string }
            capabilityId: { type: string }
            propertyId: { type: string }
        value:
          oneOf:
            - { type: "null", description: No trustworthy value has ever been observed. }
            - { $ref: "#/components/schemas/StateTypedValue" }
        providerId: { type: string }
        source: { type: string, enum: [reported, polled, optimistic, persistent-cache, unknown] }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        quality: { type: string, enum: [confirmed, reported, polled, optimistic, stale, unknown] }
        known: { type: boolean }
        available: { type: boolean }
        unavailableReason: { type: string, enum: [never-reported, device-offline, availability-unknown, disabled, removed, expired, command-unconfirmed, stale] }
        traceId: { type: string, description: Core event trace ID or originating command correlation ID. }
        pendingCommandId: { type: string }
    StateTypedValue:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [bool, int, number, string, enum] }
        bool: { type: boolean }
        int: { type: integer, format: int64 }
        number: { type: number }
        string: { type: string }
    Property:
      type: object
      required: [definition, value]
      properties:
        definition: { type: object, additionalProperties: true }
        value: { $ref: "#/components/schemas/PropertyValue" }
    ParameterRole:
      type: object
      required: [level, behavior]
      properties:
        level: { type: string, enum: [required, optional, custom] }
        behavior: { type: string }
    ModelParameter:
      type: object
      required: [path, name, level, type, readable, writable, notifiable, publisher, consumer]
      properties:
        path:
          type: object
          required: [endpointId, capabilityId, propertyId]
          properties:
            endpointId: { type: string }
            capabilityId: { type: string }
            propertyId: { type: string }
        name: { type: string }
        level: { type: string, enum: [required, optional, custom] }
        type: { type: string, enum: [bool, int, number, string, enum] }
        unit: { type: string }
        readable: { type: boolean }
        writable: { type: boolean }
        notifiable: { type: boolean }
        enum: { type: array, items: { type: string } }
        publisher: { $ref: "#/components/schemas/ParameterRole" }
        consumer: { $ref: "#/components/schemas/ParameterRole" }
    DeviceModelContract:
      type: object
      required: [deviceType, version, builtIn, parameters, custom]
      properties:
        deviceType: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        builtIn: { type: boolean }
        parameters: { type: array, items: { $ref: "#/components/schemas/ModelParameter" } }
        custom:
          type: object
          required: [publisher, consumer]
          properties:
            publisher: { $ref: "#/components/schemas/ParameterRole" }
            consumer: { $ref: "#/components/schemas/ParameterRole" }
    ModelPath:
      type: object
      required: [endpointId, capabilityId, propertyId]
      properties:
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
    MappingBinding:
      type: object
      required: [id, stage, modelEndpointId, modelCapabilityId, modelPropertyId, enabled]
      properties:
        id: { type: string }
        stage: { type: string, enum: [provider, consumer] }
        profileId: { type: string, description: Empty or omitted means identity conversion. }
        providerId: { type: string, description: Required for both stages; every route belongs to one concrete Provider device. }
        deviceId: { type: string, description: Required for both stages; mappings are never inherited by other devices of the same type. }
        endpointId: { type: string, description: Raw Provider endpoint. }
        capabilityId: { type: string, description: Raw Provider capability. }
        propertyId: { type: string, description: Raw Provider property. }
        deviceType: { type: string }
        modelEndpointId: { type: string }
        modelCapabilityId: { type: string }
        modelPropertyId: { type: string }
        consumerId: { type: string }
        targetId: { type: string, description: Concrete Target bridge ID for a bridge-owned Consumer route. Must be supplied with consumerDeviceId. }
        consumerDeviceId: { type: string, description: Concrete virtual-device ID within targetId. Makes Consumer mappings independent per bridge device. }
        consumerProperty: { type: string }
        enabled: { type: boolean }
    CustomModelProperty:
      type: object
      required: [id, deviceType, endpointId, endpointName, endpointType, capabilityId, capabilityType, definition]
      properties:
        id: { type: string }
        deviceType: { type: string }
        endpointId: { type: string }
        endpointName: { type: string }
        endpointType: { type: string }
        capabilityId: { type: string }
        capabilityType: { type: string }
        definition: { type: object, additionalProperties: true }
    ConsumerProperty:
      type: object
      required: [id, name, deviceType, defaultModelPath, level, type, readable, writable, notifiable]
      properties:
        id: { type: string }
        name: { type: string }
        deviceType: { type: string }
        defaultModelPath: { $ref: "#/components/schemas/ModelPath" }
        level: { type: string, enum: [required, optional, custom] }
        type: { type: string, enum: [bool, int, number, string, enum] }
        readable: { type: boolean }
        writable: { type: boolean }
        notifiable: { type: boolean }
    MappingCatalog:
      type: object
      required: [providers, models, consumers]
      properties:
        providers: { type: array, items: { $ref: "#/components/schemas/SourceCatalogDevice" } }
        models: { type: array, items: { $ref: "#/components/schemas/DeviceModelContract" } }
        consumers:
          type: array
          items:
            type: object
            required: [id, name, properties]
            properties:
              id: { type: string }
              name: { type: string }
              properties: { type: array, items: { $ref: "#/components/schemas/ConsumerProperty" } }
    SourceCatalogDevice:
      allOf:
        - { $ref: "#/components/schemas/Device" }
        - type: object
          required: [catalog]
          properties:
            catalog: { $ref: "#/components/schemas/SourceCatalogMetadata" }
    SourceCatalogMetadata:
      type: object
      required: [complete, source]
      properties:
        complete: { type: boolean, description: True only when the Provider enumerated the native device schema rather than mirroring configured mappings. }
        source: { type: string, enum: [provider-discovery, miot-spec.org, miot-spec-cache, configured-mapping-fallback, unified-registry-fallback] }
        specType: { type: string, description: Resolved MIoT instance URN when applicable. }
        model: { type: string }
        fetchedAt: { type: string, format: date-time }
        error: { type: string, description: Why a complete native catalog could not be produced. }
        values:
          type: object
          description: Ephemeral per-property value status keyed by endpoint/capability/property. Values are rebuilt from Provider reads and events after restart.
          additionalProperties: { $ref: "#/components/schemas/SourceValueStatus" }
    SourceValueStatus:
      type: object
      required: [known, available]
      properties:
        known: { type: boolean, description: False means the typed value in the property document is only an initialization placeholder. }
        available: { type: boolean, description: True when the value was read or observed while the source device was available. }
        observedAt: { type: string, format: date-time }
        error: { type: string, description: Most recent read error when the value is unavailable. }
    Device:
      type: object
      required: [schemaVersion, id, providerId, name, type, availability, online, endpoints, lastUpdateAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string }
        providerId: { type: string }
        name: { type: string }
        type: { type: string }
        availability: { type: string, enum: [online, offline, unknown] }
        online: { type: boolean }
        sequence: { type: integer, minimum: 0, description: Provider-local snapshot sequence when available. }
        disabled: { type: boolean, description: Persisted operator preference; Provider events cannot make the device online while true. }
        removed: { type: boolean, description: Tombstone retained after the Provider removes the device identity. }
        endpoints: { type: array, items: { type: object, additionalProperties: true } }
        lastUpdateAt: { type: string, format: date-time }
    DeviceCommandResponse:
      type: object
      required: [data, command]
      properties:
        data: { $ref: "#/components/schemas/Device" }
        command: { $ref: "#/components/schemas/Command" }
    Command:
      type: object
      required: [id, deviceId, endpointId, capabilityId, status, createdAt, updatedAt, deadline]
      properties:
        id: { type: string }
        kind: { type: string, enum: [property, action] }
        deviceId: { type: string }
        endpointId: { type: string }
        capabilityId: { type: string }
        propertyId: { type: string }
        commandId: { type: string }
        correlationId: { type: string, maxLength: 128, description: HTTP X-Request-Id that created the command. }
        coalescedRequests: { type: integer, minimum: 1, description: Number of later identical property writes that reused this command. }
        status: { type: string, enum: [queued, sent, accepted, confirmed, rejected, timeout, superseded] }
        outcome: { type: string, enum: [succeeded, failed, unknown] }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, correlationId, actor, action, resourceType, method, route, status, outcome, createdAt]
      properties:
        id: { type: integer, format: int64 }
        correlationId: { type: string, maxLength: 128 }
        actor: { type: string, example: local-api }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        method: { type: string }
        route: { type: string, description: Templated route; request bodies are never recorded. }
        status: { type: integer }
        outcome: { type: string, enum: [succeeded, failed] }
        createdAt: { type: string, format: date-time }
    ProviderInput:
      type: object
      required: [type, name, enabled, config]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: Sensitive values are returned as ********; submit the placeholder unchanged to preserve the stored value. }
    XiaomiOAuthStart:
      type: object
      required: [clientId, region]
      properties:
        clientId: { type: string, pattern: "^[0-9]+$", description: Authorized Xiaomi OAuth application ID. }
        region: { type: string, example: cn }
        redirectUrl: { type: string, format: uri, const: "http://homeassistant.local:8123", default: "http://homeassistant.local:8123", description: Fixed Xiaomi OAuth redirect URI; any supplied value is normalized to this URI. }
        oauthUuid: { type: string, pattern: "^[0-9a-f]{32}$" }
        virtualDid: { type: string, pattern: "^[0-9]+$" }
    XiaomiCloudLoginStart:
      type: object
      required: [region, username, password]
      properties:
        region: { type: string, enum: [cn, de, i2, ru, sg, tw, us, in] }
        username: { type: string }
        password: { type: string, format: password, description: Retained only in process while the live challenge is pending and encrypted only when included in a saved Provider configuration; never written to a challenge database. }
        requestTimeoutSeconds: { type: integer, minimum: 1, maximum: 120, default: 15 }
    XiaomiCloudLoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified, verification_required] }
        challengeId: { type: string }
        verificationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        userId: { type: string }
        ssecurity: { type: string }
        serviceToken: { type: string }
    XiaomiHubDevice:
      type: object
      required: [did, name]
      properties:
        did: { type: string }
        name: { type: string }
