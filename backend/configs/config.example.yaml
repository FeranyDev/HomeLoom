server:
  address: "127.0.0.1:8090"

storage:
  # database_url: "postgres://homeloom:homeloom-dev@127.0.0.1:54329/homeloom?sslmode=disable"
  database_url: "sqlite://./data/homeloom.db"
  master_key: "./data/homeloom.key"

logging:
  # Camera Kernel and Matter sidecar logs are collected by Core and shown in
  # the Web system page. Core's own level is set with the -log-level flag.
  child_level: "info"

runtime:
  # Event queue capacity is per shard (aggregate capacity: shards × capacity).
  # Higher-priority events are drained first; queued property updates may be
  # coalesced by Core before reaching a Provider/Target handler.
  event_queue_shards: 8
  event_queue_capacity: 128
  # 0 disables persistence. Set 60..86400 for a low-frequency last-known
  # state cache; every restored value is marked stale until a Provider reports.
  state_checkpoint_interval_seconds: 0

media:
  # Core directly owns media lifecycle and authorization. Only the constrained
  # per-camera kernel and FFmpeg remain external executables.
  enabled: true
  # HomeLoom-owned constrained camera kernel, built beside Core.
  camera_kernel_binary: "homeloom-camera-kernel"
  # Durable per-camera HomeKit identity + pairings. Keep this outside .cache
  # so Apple Home controllers survive HomeLoom restarts.
  # Detailed redacted camera diagnostics are written below each stream as
  # <runtime_dir>/<stream_id>/camera.log with four 8 MiB rotated backups.
  runtime_dir: "./data/media/publishers"
  # HAP/SRTP must be reachable from Apple Home controllers on the LAN.
  hap_host: "0.0.0.0"
  hap_port_base: 51826
  # RTSP remains loopback-only between Core-managed camera kernels.
  rtsp_port_base: 18554
  srtp_port_base: 20000
