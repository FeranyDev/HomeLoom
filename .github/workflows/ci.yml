name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/check.sh --race
      - run: ./scripts/build.sh
      - run: ./scripts/smoke.sh
      - run: ./scripts/cross-build.sh

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker buildx build --platform ${{ matrix.platform }} --file deploy/backend.Dockerfile --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::12} --build-arg BUILD_TIME=ci .
      - name: Build frontend image
        run: docker buildx build --platform ${{ matrix.platform }} --file deploy/frontend.Dockerfile .
