name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homeloom
          POSTGRES_USER: homeloom
          POSTGRES_PASSWORD: homeloom-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeloom -d homeloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/check.sh --race
      - name: Verify PostgreSQL persistence dialect
        run: ./scripts/dev-env.sh sh -c 'cd backend && go test -count=1 ./internal/persistence/gormstore'
        env:
          HOMELOOM_TEST_DATABASE_URL: postgres://homeloom:homeloom-ci@127.0.0.1:5432/homeloom?sslmode=disable
      - run: ./scripts/build.sh 0.0.0-ci
      - run: ./scripts/smoke.sh
      - run: ./scripts/cross-build.sh 0.0.0-ci

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build single-binary image
        run: docker buildx build --platform ${{ matrix.platform }} --file deploy/backend.Dockerfile --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::12} --build-arg BUILD_TIME=ci .
